<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" role="img" aria-labelledby="title">
  <title id="title">Animated signal divider</title>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cf4d6"/>
      <stop offset=".52" stop-color="#70a8ff"/>
      <stop offset="1" stop-color="#c07bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M8 16H1192" fill="none" stroke="#60789d" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M8 16H1192" fill="none" stroke="url(#signal)" stroke-opacity=".85" stroke-width="2" stroke-dasharray="42 210" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-504" dur="7s" repeatCount="indefinite"/>
  </path>
  <circle cy="16" r="3.2" fill="#b9f6ff" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M8 16H1192"/>
  </circle>
</svg>
