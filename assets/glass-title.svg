<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Mohd Kaif glass identity panel</title>
  <desc id="desc">A translucent frosted-glass card with Mohd Kaif's verified profile title and technology areas.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243450" stop-opacity=".46"/>
      <stop offset=".44" stop-color="#1c2a45" stop-opacity=".36"/>
      <stop offset="1" stop-color="#46346e" stop-opacity=".40"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#bfeaff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#d6b8ff" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bf6ee"/>
      <stop offset=".56" stop-color="#a9c7ff"/>
      <stop offset="1" stop-color="#e1b9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="10" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="38" y="62" width="358" height="278" rx="28" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.4"/>
    <rect x="45" y="69" width="344" height="264" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1"/>
    <path d="M66 64H265Q290 64 309 79" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M38 114V92Q38 62 68 62H94" fill="none" stroke="#bff7ff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="76" cy="111" r="4" fill="url(#accent)" filter="url(#text-glow)"/>
    <text x="91" y="115" fill="#d7e8f7" fill-opacity=".88" font-size="11" font-weight="600" letter-spacing="2.2">DEVELOPER PORTFOLIO</text>

    <text x="72" y="171" fill="#f7fbff" font-size="40" font-weight="700" letter-spacing=".3">MOHD KAIF</text>
    <rect x="74" y="188" width="78" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="74" y="220" fill="#e5efff" fill-opacity=".9" font-size="12" font-weight="600" letter-spacing="1.35">COMPUTER ENGINEERING STUDENT</text>
    <text x="74" y="247" fill="#d6e2f4" fill-opacity=".88" font-size="14" font-weight="400">Developer tools · Interactive systems</text>

    <g font-size="9.5" font-weight="600" letter-spacing="1.1" text-anchor="middle">
      <rect x="74" y="268" width="84" height="28" rx="14" fill="#f3fbff" fill-opacity=".09" stroke="#f3fbff" stroke-opacity=".25"/>
      <text x="116" y="286" fill="#e3f7ff">PYTHON</text>
      <rect x="166" y="268" width="112" height="28" rx="14" fill="#f3fbff" fill-opacity=".09" stroke="#f3fbff" stroke-opacity=".25"/>
      <text x="222" y="286" fill="#e3f7ff">TYPESCRIPT</text>
      <rect x="286" y="268" width="74" height="28" rx="14" fill="#f3fbff" fill-opacity=".09" stroke="#f3fbff" stroke-opacity=".25"/>
      <text x="323" y="286" fill="#e3f7ff">RUST</text>
    </g>

    <path d="M74 316H358" fill="none" stroke="#ffffff" stroke-opacity=".17" stroke-width="1"/>
    <text x="74" y="329" fill="#bdcde1" fill-opacity=".78" font-size="9" font-weight="600" letter-spacing="1.5">BUILDING TOOLS FOR CLEARER CODE</text>
  </g>
</svg>
